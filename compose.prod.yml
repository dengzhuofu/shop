services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shop}
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shop} -d ${POSTGRES_DB:-shop}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - shop-net

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE is required}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-shop}
      DB_USERNAME: ${POSTGRES_USER:-shop}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:-}
      PAYMENT_DEFAULT_PROVIDER: ${PAYMENT_DEFAULT_PROVIDER:-mock}
      PAYMENT_ALIPAY_ENABLED: ${PAYMENT_ALIPAY_ENABLED:-false}
      PAYMENT_ALIPAY_SANDBOX: ${PAYMENT_ALIPAY_SANDBOX:-true}
      PAYMENT_ALIPAY_FALLBACK_TO_MOCK: ${PAYMENT_ALIPAY_FALLBACK_TO_MOCK:-true}
      PAYMENT_ALIPAY_GATEWAY: ${PAYMENT_ALIPAY_GATEWAY:-}
      PAYMENT_ALIPAY_PARTNER: ${PAYMENT_ALIPAY_PARTNER:-}
      PAYMENT_ALIPAY_APP_ID: ${PAYMENT_ALIPAY_APP_ID:-}
      PAYMENT_ALIPAY_APP_PRIVATE_KEY: ${PAYMENT_ALIPAY_APP_PRIVATE_KEY:-}
      PAYMENT_ALIPAY_PUBLIC_KEY: ${PAYMENT_ALIPAY_PUBLIC_KEY:-}
      PAYMENT_ALIPAY_RETURN_URL: ${PAYMENT_ALIPAY_RETURN_URL:-}
      PAYMENT_ALIPAY_NOTIFY_URL: ${PAYMENT_ALIPAY_NOTIFY_URL:-}
      PAYMENT_ALIPAY_SUBJECT_PREFIX: ${PAYMENT_ALIPAY_SUBJECT_PREFIX:-isinwheel}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/category/tree >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    expose:
      - "8081"
    networks:
      - shop-net

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: /api
      NUXT_INTERNAL_API_BASE: http://backend:8081
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    expose:
      - "3000"
    networks:
      - shop-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/etc/nginx/certs/fullchain.pem}
      TLS_CERT_KEY_PATH: ${TLS_CERT_KEY_PATH:-/etc/nginx/certs/privkey.pem}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    command:
      - /bin/sh
      - -lc
      - |
        set -eu
        apk add --no-cache gettext >/dev/null
        template=/etc/nginx/templates/http.conf.template
        if [ "${HTTPS_ENABLED}" = "true" ] && [ -f "${TLS_CERT_PATH}" ] && [ -f "${TLS_CERT_KEY_PATH}" ]; then
          export https_port="${HTTPS_PORT}"
          template=/etc/nginx/templates/https.conf.template
          echo "Starting nginx with HTTPS enabled on port ${HTTPS_PORT}"
        else
          echo "Starting nginx with HTTP only"
        fi
        envsubst '$TLS_CERT_PATH $TLS_CERT_KEY_PATH $https_port' < "$template" > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./deploy/nginx:/etc/nginx/templates:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - shop-net

volumes:
  pg_data:

networks:
  shop-net:
    driver: bridge
