server:
  port: 8081

spring:
  application:
    name: shop-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:shop}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

payment:
  default-provider: ${PAYMENT_DEFAULT_PROVIDER:mock}
  alipay:
    enabled: ${PAYMENT_ALIPAY_ENABLED:false}
    sandbox: ${PAYMENT_ALIPAY_SANDBOX:true}
    fallback-to-mock: ${PAYMENT_ALIPAY_FALLBACK_TO_MOCK:true}
    gateway: ${PAYMENT_ALIPAY_GATEWAY:}
    partner: ${PAYMENT_ALIPAY_PARTNER:}
    app-id: ${PAYMENT_ALIPAY_APP_ID:}
    app-private-key: ${PAYMENT_ALIPAY_APP_PRIVATE_KEY:}
    alipay-public-key: ${PAYMENT_ALIPAY_PUBLIC_KEY:}
    return-url: ${PAYMENT_ALIPAY_RETURN_URL:http://101.200.239.103/payment/alipay-return}
    notify-url: ${PAYMENT_ALIPAY_NOTIFY_URL:http://101.200.239.103/payment/alipay/notify}
    subject-prefix: ${PAYMENT_ALIPAY_SUBJECT_PREFIX:Shop}
    cross-border-product-code: ${PAYMENT_ALIPAY_CROSS_BORDER_PRODUCT_CODE:NEW_OVERSEAS_SELLER}
