name: Build And Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build Images
    runs-on: ubuntu-latest
    outputs:
      backend_image: ${{ steps.vars.outputs.backend_image }}
      frontend_image: ${{ steps.vars.outputs.frontend_image }}
      backend_digest: ${{ steps.build_backend.outputs.digest }}
      frontend_digest: ${{ steps.build_frontend.outputs.digest }}
      deploy_bundle: ${{ steps.vars.outputs.deploy_bundle }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image names
        id: vars
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          repo="${GITHUB_REPOSITORY#*/}"
          repo="${repo,,}"
          echo "backend_image=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_OUTPUT"
          echo "deploy_bundle=deploy-bundle.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.backend_image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Docker metadata for frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.frontend_image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push backend image
        id: build_backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            MAVEN_MIRROR_URL=https://maven.aliyun.com/repository/public
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        id: build_frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build deploy bundle
        shell: bash
        run: |
          tar -czf "${{ steps.vars.outputs.deploy_bundle }}" \
            compose.prod.yml \
            deploy/nginx/http.conf.template \
            deploy/nginx/https.conf.template \
            deploy/remote/bootstrap-server.sh \
            deploy/remote/deploy_registry.sh \
            backend/src/main/resources/schema.sql

      - name: Upload deploy bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.deploy_bundle }}
          path: ${{ steps.vars.outputs.deploy_bundle }}
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy On Production Runner
    runs-on:
      - self-hosted
      - linux
      - x64
      - shop-prod
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}@${{ needs.build.outputs.backend_digest }}
      FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}@${{ needs.build.outputs.frontend_digest }}
      GHCR_USERNAME: ${{ secrets.PROD_GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.PROD_GHCR_READ_TOKEN }}
      PROD_PROJECT_DIR: ${{ secrets.PROD_PROJECT_DIR }}
      PAYMENT_DEFAULT_PROVIDER: ${{ secrets.PROD_PAYMENT_DEFAULT_PROVIDER }}
      PAYMENT_ALIPAY_ENABLED: ${{ secrets.PROD_PAYMENT_ALIPAY_ENABLED }}
      PAYMENT_ALIPAY_SANDBOX: ${{ secrets.PROD_PAYMENT_ALIPAY_SANDBOX }}
      PAYMENT_ALIPAY_FALLBACK_TO_MOCK: ${{ secrets.PROD_PAYMENT_ALIPAY_FALLBACK_TO_MOCK }}
      PAYMENT_ALIPAY_GATEWAY: ${{ secrets.PROD_PAYMENT_ALIPAY_GATEWAY }}
      PAYMENT_ALIPAY_PARTNER: ${{ secrets.PROD_PAYMENT_ALIPAY_PARTNER }}
      PAYMENT_ALIPAY_APP_ID: ${{ secrets.PROD_PAYMENT_ALIPAY_APP_ID }}
      PAYMENT_ALIPAY_APP_PRIVATE_KEY: ${{ secrets.PROD_PAYMENT_ALIPAY_APP_PRIVATE_KEY }}
      PAYMENT_ALIPAY_PUBLIC_KEY: ${{ secrets.PROD_PAYMENT_ALIPAY_PUBLIC_KEY }}
      PAYMENT_ALIPAY_RETURN_URL: ${{ secrets.PROD_PAYMENT_ALIPAY_RETURN_URL }}
      PAYMENT_ALIPAY_NOTIFY_URL: ${{ secrets.PROD_PAYMENT_ALIPAY_NOTIFY_URL }}
      PAYMENT_ALIPAY_SUBJECT_PREFIX: ${{ secrets.PROD_PAYMENT_ALIPAY_SUBJECT_PREFIX }}
    steps:
      - name: Download deploy bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.deploy_bundle }}

      - name: Deploy locally on server
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${PROD_PROJECT_DIR:-/opt/shop}"
          mkdir -p "$PROJECT_DIR"
          tar -xzf "${{ needs.build.outputs.deploy_bundle }}" -C "$PROJECT_DIR"
          chmod +x "$PROJECT_DIR/deploy/remote/bootstrap-server.sh" "$PROJECT_DIR/deploy/remote/deploy_registry.sh"
          export GHCR_USERNAME GHCR_TOKEN
          export PAYMENT_DEFAULT_PROVIDER PAYMENT_ALIPAY_ENABLED PAYMENT_ALIPAY_SANDBOX PAYMENT_ALIPAY_FALLBACK_TO_MOCK
          export PAYMENT_ALIPAY_GATEWAY PAYMENT_ALIPAY_PARTNER
          export PAYMENT_ALIPAY_APP_ID PAYMENT_ALIPAY_APP_PRIVATE_KEY PAYMENT_ALIPAY_PUBLIC_KEY
          export PAYMENT_ALIPAY_RETURN_URL PAYMENT_ALIPAY_NOTIFY_URL PAYMENT_ALIPAY_SUBJECT_PREFIX
          bash "$PROJECT_DIR/deploy/remote/deploy_registry.sh" "$PROJECT_DIR" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "${{ github.sha }}"

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${PROD_PROJECT_DIR:-/opt/shop}"
          cd "$PROJECT_DIR"
          if docker compose version >/dev/null 2>&1; then
            docker compose -f compose.prod.yml ps
            curl -fsS --max-time 20 http://127.0.0.1/ >/dev/null
            curl -fsS --max-time 20 http://127.0.0.1/api/category/tree >/dev/null
          else
            docker-compose -f compose.prod.yml ps
            curl -fsS --max-time 20 http://127.0.0.1/ >/dev/null
            curl -fsS --max-time 20 http://127.0.0.1/api/category/tree >/dev/null
          fi

      - name: Dump container diagnostics on failure
        if: failure()
        shell: bash
        run: |
          PROJECT_DIR="${PROD_PROJECT_DIR:-/opt/shop}"
          cd "$PROJECT_DIR"
          mkdir -p diagnostics
          if docker compose version >/dev/null 2>&1; then
            docker compose -f compose.prod.yml ps | tee diagnostics/compose-ps.txt || true
            docker compose -f compose.prod.yml logs --tail=200 nginx frontend backend db | tee diagnostics/compose-logs.txt || true
          else
            docker-compose -f compose.prod.yml ps | tee diagnostics/compose-ps.txt || true
            docker-compose -f compose.prod.yml logs --tail=200 nginx frontend backend db | tee diagnostics/compose-logs.txt || true
          fi

      - name: Upload diagnostics artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-diagnostics
          path: ${{ env.PROD_PROJECT_DIR }}/diagnostics
          if-no-files-found: error
          retention-days: 3
